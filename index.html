<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sign-Up Form</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <div class="imgCon">
                <div class="imgSidebar">
                    <img src="https://images.unsplash.com/photo-1786967626353-dc7ea65a4a67?q=80&w=721&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="A deep ravine with lush greenery clinging to the rocks and flowing blue water.">
                    <h1>The Odin Project</h1>
                    <p>Photo by <a href="https://unsplash.com/@debrupas">Pascal Debrunner</a> on <a href="https://unsplash.com/photos/river-flowing-through-rocky-gorge-li5A0vC8Z3o">Unsplash</a></p>
                </div>
            </div>
            <div class="formCon">
                <div class="text"></div>
                <form method="post">
                    <div class="form">
                        <div class="left">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="firstName" autocomplete="given-name" minlength="2" maxlength="25" pattern="[^0-9]+" required>

                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" autocomplete="email" required>
                    
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" minlength="8" maxlength="25" required>
                        </div>
                        <div class="right">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="lastName" autocomplete="family-name" minlength="2" maxlength="25" pattern="[^0-9]+" required>

                            <label for="number">Phone Number</label>
                            <input type="tel" id="number" name="number" autocomplete="tel" minlength="3" maxlength="15" required>
                    
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" maxlength="25" required>
                        </div>
                        <!-- Restrict character limit for each input -->
                        <!-- Set a pattern for each input. -->
                    </div>
                    <div class="button">
                        <button type="submit">Create Account</button>
                    </div>
                </form>
                <div class="login">
                    <p>Already have an account? <a href="http://127.0.0.1:5500/index.html">Log in</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
