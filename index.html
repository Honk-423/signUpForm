<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sign-Up Form</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="container">
            <div class="imgCon">
                <div class="imgSidebar">
                    <img src="https://images.unsplash.com/photo-1786967626353-dc7ea65a4a67?q=80&w=721&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="A deep ravine with lush greenery clinging to the rocks and flowing blue water.">
                    <h1>The Odin Project</h1>
                    <p>Photo by <a href="https://unsplash.com/@debrupas">Pascal Debrunner</a> on <a href="https://unsplash.com/photos/river-flowing-through-rocky-gorge-li5A0vC8Z3o">Unsplash</a></p>
                </div>
            </div>
            <div class="formCon">
                <div class="text"></div>
                <div class="form">
                    <div class="left">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName">

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                        
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="right">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName">

                        <label for="number">Phone Number</label>
                        <input type="tel" id="number" name="number">
                        
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword">
                    </div>
                </div>
                <div class="button"></div>
                <div class="login"></div>
            </div>
        </div>
    </body>
</html>
